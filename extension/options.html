<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Agent — Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #7c5cff;
        --accent-2: #4f8cff;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
      }
      h1 {
        font-size: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 20px;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #8884;
        background: transparent;
        color: inherit;
        font-size: 14px;
      }
      .hint {
        font-size: 13px;
        opacity: 0.7;
        margin-top: 4px;
      }
      button {
        margin-top: 24px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #saved {
        margin-left: 12px;
        color: #22c55e;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #saved.show {
        opacity: 1;
      }
      code {
        background: #8882;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1><span class="logo">✦</span> Gemini Agent Settings</h1>
    <p>
      The extension talks to your own backend server, which holds the Gemini API key.
      Start it with <code>cd backend &amp;&amp; npm start</code>.
    </p>

    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:8787" />
    <div class="hint">Where your backend server is running. Default: <code>http://localhost:8787</code></div>

    <label for="maxSteps">Max agent steps per request</label>
    <input id="maxSteps" type="number" min="1" max="40" placeholder="16" />
    <div class="hint">Safety limit on how many actions the agent takes before stopping.</div>

    <div>
      <button id="save">Save</button>
      <span id="saved">✓ Saved</span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
